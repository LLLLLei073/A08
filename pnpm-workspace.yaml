packages:
  - 'packages/*'
# 允许这些依赖在安装时执行构建脚本（下载/编译原生二进制，如 Prisma 引擎、esbuild）
# allowBuilds 为 pnpm 10.8+ 写法；onlyBuiltDependencies 为 pnpm 9 兼容写法，二者并存无害
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  vue-demi: true
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma
  - vue-demi
